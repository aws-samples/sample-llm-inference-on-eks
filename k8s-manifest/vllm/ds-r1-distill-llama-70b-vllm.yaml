apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepseek-llama-70b-vllm
  labels:
    app: deepseek-llama-70b
    engine: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deepseek-llama-70b
      engine: vllm
  template:
    metadata:
      labels:
        app: deepseek-llama-70b
        engine: vllm
    spec:
      priorityClassName: high-priority-100
      nodeSelector:
        node.kubernetes.io/instance-type: g6e.12xlarge # 4 L40S GPU, 192G GPU Memory
      containers:
      - name: deepseek
        image: vllm/vllm-openai:v0.24.0
        command: [ "/bin/sh", "-c" ]
        args: [ "vllm serve deepseek-ai/DeepSeek-R1-Distill-Llama-70B --tensor-parallel-size 4 --max-model-len 32768 --enforce-eager" ]
        env:
        - name: NCCL_DEBUG
          value: "INFO"
        - name: NCCL_IB_DISABLE
          value: "1"
        - name: NCCL_P2P_DISABLE
          value: "1"
        - name: NCCL_SHM_DISABLE
          value: "0"
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: "32"
            memory: 300G
            nvidia.com/gpu: "4"
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: cache-volume
        - name: shm
          mountPath: /dev/shm
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      volumes:
      - name: cache-volume
        hostPath:
          path: /tmp/deepseek
          type: DirectoryOrCreate
      # vLLM needs to access the host's shared memory for tensor parallel inference.
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "8Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: deepseek-svc-llama-70b-vllm
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app: deepseek-llama-70b
    engine: vllm
  type: ClusterIP
