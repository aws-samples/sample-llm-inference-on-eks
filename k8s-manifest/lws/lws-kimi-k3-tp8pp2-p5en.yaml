# Kimi-K3 (2.8T MXFP4 MoE) on vLLM, TP=8 x PP=2 across 2x p5en.48xlarge (16x H200).
# Engine args follow the official recipe's *h200* multi_node_tp_pp profile
# (https://recipes.vllm.ai/moonshotai/Kimi-K3?hardware=h200 -> multi_node_tp_pp),
# which is itself a 2-node TP8xPP2 shape, with two deliberate deviations —
# --gpu-memory-utilization and --max-model-len. See the notes at those args.
#
# Deployed and load-tested 2026-08-06. Performance numbers and the TP16-vs-PP2
# comparison live in docs/, not here.
#
# 1M CONTEXT WORKS ON 2 NODES — the third node is not required for it. PP shards
# layers, so each GPU stores fewer of them and the weight footprint drops (96.49 vs
# 129.75 GiB/GPU vs TP16, both measured), which is what frees the memory the KV pool
# needs. Note TP width does NOT do this: MLA KV is built with num_kv_heads=1
# ("Only has one vector instead of K + V",
# vllm/model_executor/models/deepseek_v2.py:634), so it is not TP-sharded.
#
# KNOWN ENGINE BUG, unrelated to this config: any request whose input exceeds
# --max-num-batched-tokens (4096) is chunk-prefilled, and every chunk boundary after
# the first logs
#   IndexError: index_fill_(): Expected dtype int64 for index
#   at vllm/v1/worker/gpu/model_states/mamba_hybrid.py:314 postprocess_state
# Measured 2026-08-06: 0 errors at ISL 3,826 (1 chunk), 32 at ISL 4,226 (2 chunks),
# scaling as 32 x (chunks - 1) up to ~2,500 at ISL 1,040,032. Requests still return
# HTTP 200 with plausible answers and the engine survives, but this is the KDA
# state-handoff path, so long-context output quality is NOT verified. Short requests
# (<= 1 chunk) are unaffected. Fix belongs in the image, not in these args.
#
# IMAGE PREREQUISITE: the upstream vllm/vllm-openai:kimi-k3 image contains NO EFA
# userspace (verified from its image config 2026-07-31 — zero efa/libfabric/ofi
# hits across all 103 history entries), so the cross-node pipeline traffic would
# fall back to TCP over eth0. Build Dockerfile.efa-vllm-kimi-k3 first.
#
# Weights: ~1.56 TB across 118 files, public/ungated. First start on fresh nodes
# downloads all of it to node-local NVMe (~12 min at the 2.28 GiB/s measured
# 2026-08-03); each node needs its own copy.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: lws-kimi-k3-pp2
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    # RecreateGroupOnPodRestart, NOT None. Measured 2026-07-31 on the TP16 shape:
    # with None, the leader crash-looped while the worker container stayed up
    # (restartCount 0), so each new leader created a fresh TCPStore that the
    # worker's already-joined ranks never rejoined — the rendezvous stalled at
    # "8/16 clients joined" and timed out after 601s, forever. vLLM's TCPStore
    # rendezvous has no re-join path, so the group MUST restart as a unit.
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          role: leader
      spec: &common-spec
        priorityClassName: high-priority-100
        nodeSelector:
          node.kubernetes.io/instance-type: p5en.48xlarge
        tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        # Same-AZ co-location, REQUIRED for EFA RDMA. Measured 2026-08-03 on the
        # TP16 shape: with only the instance-type nodeSelector, Karpenter put the
        # leader in us-west-2a and the worker in us-west-2c, and NCCL died at
        # connect time with
        #   NET/OFI CM: Unable to insert remote address into address vector
        #   NET/OFI CM connect failed: Failed call to fi_av_insert
        # EFA is an intra-AZ fabric — a cross-AZ group cannot form at all.
        # Self-selecting podAffinity pins every pod of the group into one zone; it
        # cannot deadlock the first pod, because a required podAffinity term that
        # matches no existing pod is treated as satisfied.
        # Do NOT use the LWS `exclusive-topology` annotation instead: the
        # controller turns it into podAntiAffinity, which does the opposite.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  leaderworkerset.sigs.k8s.io/name: lws-kimi-k3-pp2
              topologyKey: topology.kubernetes.io/zone
        containers:
        - name: kimi-leader
          image: &common-image <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/vllm-efa-kimi-k3:kimi-k3-efa1.49 # built from Dockerfile.efa-vllm-kimi-k3
          imagePullPolicy: IfNotPresent
          # Base image entrypoint is ["vllm","serve"]; args supply the rest.
          args: &common-args
            - moonshotai/Kimi-K3
            - --host=0.0.0.0
            - --port=8000
            - --trust-remote-code
            # multi-node wiring: vLLM's own multiproc backend (no Ray).
            # world_size = TP8 x PP2 = 16; local_world_size = 16/2 = 8, i.e. one
            # full TP group per node (vllm/config/parallel.py::local_world_size),
            # so TP collectives stay on NVLink and only PP crosses EFA.
            # --master-port is left at vLLM's default 29501
            # (vllm/config/parallel.py:273) — the leader's containerPort below
            # matches it. Only the leader binds it; the worker dials out, so its
            # container declares no ports.
            - --tensor-parallel-size=8
            - --pipeline-parallel-size=2
            - --nnodes=2
            - --master-addr=$(LWS_LEADER_ADDRESS)
            # --- recipe's h200 multi_node_tp_pp profile ---
            # 0.93, NOT the recipe's 0.97. At 0.97 this shape starts and serves
            # single requests, then CUDA-OOMs under concurrency — measured
            # 2026-08-06, it ran out by 42 MiB during a 4-way load test. vLLM
            # profiles the activation peak once on a single request and gives all
            # remaining memory to the KV pool, so the real peak under concurrency
            # has nowhere to go. Counter-intuitively PP2 is more exposed than TP16:
            # its thinner weights let the KV pool grow instead. 0.93 returns
            # ~5.6 GiB/GPU to activations; the KV cost is affordable here.
            # Do not raise this back up.
            - --gpu-memory-utilization=0.93
            - --max-num-seqs=5
            # Full 1M window, not the recipe's 32768. Verified 2026-08-06: at
            # util 0.93 the engine reports "GPU KV cache size: 2,230,426 tokens"
            # and "Maximum concurrency for 1,048,576 tokens per request: 2.13x",
            # and a 1,040,032-token request completed. Read those two lines from
            # the startup log after any change here; if the engine refuses to
            # allocate KV it prints an "estimated maximum model length" — trust
            # that and set this just below it.
            - --max-model-len=1048576
            - --moe-backend=marlin
            - --disable-custom-all-reduce
            - --no-enable-flashinfer-autotune
            - --max-num-batched-tokens=4096
            - --attention-backend=FLASHMLA
            # thinking / tool-call parsing. Recipe warns K3 occasionally emits a
            # tool-call shape its own parser rejects — validate + retry client-side.
            - --enable-auto-tool-choice
            - --tool-call-parser=kimi_k3
            - --reasoning-parser=kimi_k3
            - --served-model-name=moonshotai/Kimi-K3
            # rank differs per role — leader is 0, worker sets its own below
            - --node-rank=0
          env: &common-env
            # --- recipe's multi_node_tp_pp profile env ---
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "3600"
            # this profile adds it over plain multi_node_tp: a PP stage can sit
            # waiting on an upstream stage far longer than a TP peer ever would
            - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
              value: "1800"
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "1"
            - name: VLLM_USE_RUST_FRONTEND
              value: "1"
            # also specific to this profile (not in multi_node_tp)
            - name: NCCL_CUMEM_ENABLE
              value: "1"
            # The recipe's hopper profile sets this. Safe here — unlike the SGLang
            # TP manifests (see lws/README.md "Memory"), which break on it because
            # custom all-reduce cannot IPC-register VMM allocations; this manifest
            # passes --disable-custom-all-reduce, so NCCL is used instead.
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            # NCCL Configuration
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: GLOO_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_P2P_LEVEL
              value: "NVL"
            # EFA Configuration
            - name: FI_PROVIDER
              value: "efa"
            - name: FI_EFA_USE_DEVICE_RDMA
              value: "1"
            - name: NCCL_NET_PLUGIN
              value: "ofi"
            - name: NCCL_TUNER_PLUGIN
              value: "ofi"
          ports: &common-ports
            - name: http
              containerPort: 8000
            - name: dist
              containerPort: 29501
          resources: &common-resources
            limits:
              vpc.amazonaws.com/efa: "16"
              nvidia.com/gpu: "8"
              # node has ~1.96 TiB allocatable; must also cover the 500Gi
              # /dev/shm emptyDir below (medium: Memory counts against this)
              memory: 1800Gi
              ephemeral-storage: 200Gi
          # first start downloads ~1.56 TB of weights — allow up to 150 min
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 300
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 600
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5
          volumeMounts: &common-volume-mounts
            - name: cache-volume
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
          securityContext: &common-security-context
            # IPC_LOCK is what vLLM's own docs ask for to enable GPUDirect RDMA
            # (docs/serving/parallelism_scaling.md). Deliberately NOT privileged:
            # the EFA device plugin injects /dev/infiniband whenever the pod
            # requests vpc.amazonaws.com/efa, so privileged is not needed for EFA
            # (measured on TP16/p5en 2026-07-31 — see CLAUDE.md).
            capabilities:
              add:
              - IPC_LOCK
        volumes: &common-volumes
          - name: cache-volume
            hostPath:
              path: /mnt/k8s-disks/0/models/kimi
              type: DirectoryOrCreate
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: "500Gi"
    workerTemplate:
      spec:
        <<: *common-spec
        containers:
        - name: kimi-worker
          image: *common-image
          imagePullPolicy: IfNotPresent
          # Same args as the leader except the last two: --node-rank comes from
          # LWS's worker index, and --headless makes this engine-only. A headless
          # worker starts NO API server, so it has no /health endpoint — its probes
          # must stay tcpSocket-only (see below).
          args:
            - moonshotai/Kimi-K3
            - --host=0.0.0.0
            - --port=8000
            - --trust-remote-code
            - --tensor-parallel-size=8
            - --pipeline-parallel-size=2
            - --nnodes=2
            - --master-addr=$(LWS_LEADER_ADDRESS)
            # must stay identical to the leader's — see the notes there
            - --gpu-memory-utilization=0.93
            - --max-num-seqs=5
            - --max-model-len=1048576
            - --moe-backend=marlin
            - --disable-custom-all-reduce
            - --no-enable-flashinfer-autotune
            - --max-num-batched-tokens=4096
            - --attention-backend=FLASHMLA
            - --enable-auto-tool-choice
            - --tool-call-parser=kimi_k3
            - --reasoning-parser=kimi_k3
            - --served-model-name=moonshotai/Kimi-K3
            - --node-rank=$(LWS_WORKER_INDEX)
            - --headless
          env:
            - name: LWS_WORKER_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['leaderworkerset.sigs.k8s.io/worker-index']
            - name: VLLM_ENGINE_READY_TIMEOUT_S
              value: "3600"
            - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
              value: "1800"
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "1"
            - name: VLLM_USE_RUST_FRONTEND
              value: "1"
            - name: NCCL_CUMEM_ENABLE
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: GLOO_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_P2P_LEVEL
              value: "NVL"
            - name: FI_PROVIDER
              value: "efa"
            - name: FI_EFA_USE_DEVICE_RDMA
              value: "1"
            - name: NCCL_NET_PLUGIN
              value: "ofi"
            - name: NCCL_TUNER_PLUGIN
              value: "ofi"
          # No ports: a headless worker does not listen on anything. It dials OUT
          # to the leader's 29501 (vllm/entrypoints/cli/serve.py::run_headless ->
          # the node_rank_within_dp > 0 branch builds MultiprocExecutor and calls
          # start_worker_monitor(inline=True); nothing binds).
          resources: *common-resources
          # Probes here CANNOT be httpGet or tcpSocket — headless mode starts no
          # API server and opens no listening socket (the worker dials OUT to the
          # leader's 29501), so any such probe would fail on a healthy pod and, with
          # RecreateGroupOnPodRestart, take the leader down with it on every cycle.
          # What we can verify is that the per-GPU worker processes are alive:
          # MultiprocExecutor spawns one per local GPU, so 8 on this node.
          #
          # The pattern is "VLLM::Worker", verified by exec'ing into a live pod
          # 2026-08-06. Do not use the process name from the Process(name=...) call
          # in multiproc_executor.py — the worker overwrites it at runtime via
          # set_process_title() with a topology-dependent string
          # ("VLLM::Worker_PP1_TP0" on the PP2 shape; suffixes appear only when the
          # corresponding parallel dim is > 1). The "VLLM::Worker" prefix is the
          # part that is stable across TP/PP/DP/EP layouts.
          #
          # This is not redundant with the container's own exit behaviour: the
          # inline worker monitor makes the main process exit when a subprocess
          # dies, which K8s already catches. It covers what exit does not — a
          # process still running but wedged, or fewer than 8 ever coming up.
          # The startupProbe gives the group a bounded window (up to 150 min) to
          # load 1.56 TB of weights before liveness starts counting.
          startupProbe:
            exec: &worker-alive
              # 8 = GPUs on this node, i.e. one worker process per local GPU.
              # pgrep matches on comm (NOT -f), which is what makes this safe:
              # with -f the probe's own shell would match its own pattern and
              # inflate the count. Measured on the live pod 2026-08-06: this
              # returns exactly 8 on both worker and leader, while a
              # `grep -la ... /proc/*/cmdline` variant returned 10 (self-match).
              command: ["pgrep", "-c", "VLLM::Worker"]
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 300
          livenessProbe:
            exec: *worker-alive
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5
          # No readinessProbe: the worker backs no Service, so readiness would gate
          # nothing. Restarting the group is the leader's job (restartPolicy above).
          volumeMounts: *common-volume-mounts
          securityContext: *common-security-context
        volumes: *common-volumes
---
apiVersion: v1
kind: Service
metadata:
  name: kimi-k3-pp2-leader
spec:
  selector:
    leaderworkerset.sigs.k8s.io/name: lws-kimi-k3-pp2
    role: leader
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
  type: ClusterIP
