apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8b-sglang
  labels:
    app: qwen3-8b
    engine: sglang
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-8b-sglang
      engine: sglang
  template:
    metadata:
      labels:
        app: qwen3-8b-sglang
        model: qwen3-8b
        engine: sglang
    spec:
      priorityClassName: high-priority-100
      # Any single-GPU g6e (1x L40S 48GB) will do — capacity-type deliberately
      # unpinned so Karpenter falls back to on-demand when g6e spot is dry.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                - g6e.2xlarge
                - g6e.4xlarge
                - g6e.8xlarge
                - g6e.16xlarge
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: sglang
        image: docker.io/lmsysorg/sglang:v0.5.13.post1
        imagePullPolicy: IfNotPresent
        command: [ "python3", "-m", "sglang.launch_server" ]
        args:
        - "--model=Qwen/Qwen3-8B"
        - "--host=0.0.0.0"
        - "--port=8000"
        - "--mem-fraction-static=0.85"
        - "--trust-remote-code"
        ports:
        - name: http
          containerPort: 8000
        resources:
          limits:
            cpu: "6"
            memory: 28G
            nvidia.com/gpu: "1"
          requests:
            cpu: "4"
            memory: 20G
            nvidia.com/gpu: "1"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 60
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: cache-volume
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: cache-volume
        hostPath:
          path: /mnt/k8s-disks/0/models/qwen
          type: DirectoryOrCreate
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "4Gi"
---

apiVersion: v1
kind: Service
metadata:
  name: qwen3-8b-sglang-svc
spec:
  selector:
    app: qwen3-8b-sglang
    engine: sglang
  ports:
  - protocol: TCP
    port: 80 # port on host
    targetPort: http # port in container
  type: ClusterIP
