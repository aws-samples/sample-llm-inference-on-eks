apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-32b-sglang
  labels:
    app: qwen-32b
    engine: sglang
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen-32b-sglang
      engine: sglang
  template:
    metadata:
      labels:
        app: qwen-32b-sglang
        model: qwen-32b
        engine: sglang
    spec:
      priorityClassName: high-priority-100
      nodeSelector:
        node.kubernetes.io/instance-type: g6e.12xlarge
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: sglang
        image: docker.io/lmsysorg/sglang:v0.4.7.post1-cu124
        imagePullPolicy: Always # IfNotPresent or Never
        command: [ "python3", "-m", "sglang.launch_server" ]
        args:
        - "--model=Qwen/Qwen3-32B"
        - "--host=0.0.0.0"
        - "--port=8000"
        - "--tensor-parallel-size=2"
        - "--disable-custom-all-reduce"
        - "--trust-remote-code"
        ports:
        - name: http
          containerPort: 8000
        resources:
          limits:
            cpu: "32"
            memory: 100G
            nvidia.com/gpu: "2"
          requests:
            cpu: "20"
            memory: 100G
            nvidia.com/gpu: "2"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: cache-volume
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: cache-volume
        hostPath:
          path: /tmp/deepseek
          type: DirectoryOrCreate
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "4Gi"
---

apiVersion: v1
kind: Service
metadata:
  name: qwen-32b-sglang-svc
spec:
  selector:
    app: qwen-32b-sglang
  ports:
  - protocol: TCP
    port: 80 # port on host
    targetPort: http # port in container
  type: ClusterIP
