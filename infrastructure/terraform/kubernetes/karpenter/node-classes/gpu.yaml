apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  # The alias expands to every AL2023 variant, each carrying arch and
  # instance-gpu-count/accelerator-count requirements, so GPU instance types
  # resolve to amazon-eks-node-al2023-<arch>-nvidia on their own. That AMI ships
  # the NVIDIA driver and nvidia-container-toolkit preinstalled, so the GPU
  # Operator runs with driver.enabled=false / toolkit.enabled=false (see
  # kubernetes/gpu-operator/).
  amiSelectorTerms:
  - alias: al2023@latest
  instanceStorePolicy: RAID0
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 500Gi
        volumeType: gp3
        encrypted: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  role: ${cluster_name}
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: ${cluster_name}
  subnetSelectorTerms:
  - tags:
      karpenter.sh/discovery: ${cluster_name}
  tags:
    karpenter.sh/discovery: ${cluster_name}
