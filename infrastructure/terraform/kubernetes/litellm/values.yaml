# Service account is what the EKS Pod Identity association binds to —
# name must match module.litellm_bedrock_pod_identity in litellm-langfuse.tf
serviceAccount:
  create: true
  name: litellm

masterkey: ${master_key}

# Bundled Postgres: required for the Admin UI login, virtual keys and spend tracking
db:
  deployStandalone: true
  useExisting: false
migrationJob:
  enabled: true

postgresql:
  image:
    # Bitnami moved its free images out of docker.io/bitnami into
    # docker.io/bitnamilegacy; the chart's pinned tag 404s on the old path.
    repository: bitnamilegacy/postgresql
  auth:
    username: litellm
    database: litellm
    password: ${postgres_password}
    postgres-password: ${postgres_password}

%{ if langfuse_enabled ~}
envVars:
  # In-cluster Langfuse — the chart's web Service is <release>-web
  LANGFUSE_HOST: ${langfuse_host}
  LANGFUSE_PUBLIC_KEY: ${langfuse_public_key}
  LANGFUSE_SECRET_KEY: ${langfuse_secret_key}
%{ endif ~}

proxy_config:
  model_list:
  # ---------------------------------------------------------------------------
  # Self-hosted models from k8s-manifest/. Add an entry per model you actually
  # deployed — `model:` is `openai/` + the manifest's --served-model-name, and
  # `api_base` is the model Service's in-cluster FQDN. Nothing is listed by
  # default because which models exist depends on what you applied.
  #
  # - model_name: <name clients ask for>
  #   litellm_params:
  #     model: openai/<the --served-model-name value>
  #     api_base: http://<service>.<namespace>.svc.cluster.local/v1
  #     api_key: dummy   # this repo's manifests serve without auth
  # ---------------------------------------------------------------------------
  # Bedrock via EKS Pod Identity. No aws_access_key_id/secret here on purpose:
  # boto3's default chain resolves credentials from the Pod Identity agent.
  # Model IDs must exist in ${region} — check with
  #   aws bedrock list-inference-profiles --region ${region}
  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-5
      aws_region_name: ${region}
  - model_name: claude-haiku-4-5
    litellm_params:
      model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: ${region}
%{ if langfuse_enabled ~}
  litellm_settings:
    success_callback: ["langfuse"]
    failure_callback: ["langfuse"]
%{ endif ~}
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY

# ClusterIP + port-forward, matching every Service in k8s-manifest/. This stack
# has enable_aws_load_balancer_controller = false and no external-dns, so an
# Ingress here would never get an address.
ingress:
  enabled: false

service:
  type: ClusterIP
  port: 4000
