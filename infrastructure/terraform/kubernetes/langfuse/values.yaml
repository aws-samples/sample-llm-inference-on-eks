langfuse:
  salt:
    value: "${salt}"
  nextauth:
    # ClusterIP-only deployment: this must match how you actually reach the UI,
    # so it assumes `kubectl port-forward svc/langfuse-web 3000:3000`. Behind an
    # Ingress, set it to the external URL or NextAuth callbacks break.
    url: http://localhost:3000
    secret:
      value: "${nextauth_secret}"
  encryptionKey:
    value: "${encryption_key}"

  # Headless init: provision org/project/API keys/admin user on first boot,
  # so LiteLLM's callback keys work without any UI steps.
  additionalEnv:
  - name: LANGFUSE_INIT_ORG_ID
    value: default-org
  - name: LANGFUSE_INIT_ORG_NAME
    value: Default Org
  - name: LANGFUSE_INIT_PROJECT_ID
    value: default-project
  - name: LANGFUSE_INIT_PROJECT_NAME
    value: Default Project
  - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
    value: "${langfuse_public_key}"
  - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
    value: "${langfuse_secret_key}"
  - name: LANGFUSE_INIT_USER_EMAIL
    value: "${admin_email}"
  - name: LANGFUSE_INIT_USER_NAME
    value: Admin
  - name: LANGFUSE_INIT_USER_PASSWORD
    value: "${admin_password}"

  # ClusterIP + port-forward, matching every Service in k8s-manifest/. This
  # stack has enable_aws_load_balancer_controller = false and no external-dns,
  # so an Ingress here would never get an address.
  ingress:
    enabled: false

postgresql:
  auth:
    password: "${postgres_password}"

clickhouse:
  auth:
    password: "${clickhouse_password}"
  # Single-node ClickHouse: no HA, no keeper quorum. Enough for tracing a demo
  # cluster's traffic, not sized for production ingest.
  replicaCount: 1
  clusterEnabled: false
  resourcesPreset: medium
  zookeeper:
    enabled: false

redis:
  auth:
    password: "${redis_password}"

s3:
  auth:
    rootPassword: "${s3_root_password}"
